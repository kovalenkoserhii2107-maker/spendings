<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Іконки Up&amp;D</title>
<style>
  body { margin: 24px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #EEF2F7; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  canvas { display: block; max-width: 180px; height: auto; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<h1>Іконки додатка з <code>../icon.svg</code></h1>
<p>Відкрийте цю сторінку з локального сервера (<code>python3 -m http.server</code> у папці сайту), збережіть файли за посиланнями й покладіть їх у <code>icons/</code>.</p>
<div class="row" id="out"></div>
<script>
// name, size, full-bleed black background, share of the canvas the logo takes
const ICONS = [
  ['icon-192.png', 192, false, 1],
  ['icon-512.png', 512, false, 1],
  ['maskable-512.png', 512, true, 0.72],  // inside the 80% safe zone of maskable icons
  ['apple-touch-icon.png', 180, true, 0.86], // iOS rounds the corners itself
];
const img = new Image();
img.onload = () => {
  for (const [name, size, bleed, scale] of ICONS) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    if (bleed) { g.fillStyle = '#000'; g.fillRect(0, 0, size, size); }
    const s = size * scale;
    g.drawImage(img, (size - s) / 2, (size - s) / 2, s, s);
    const a = document.createElement('a');
    a.download = name;
    a.textContent = name;
    c.toBlob((b) => { a.href = URL.createObjectURL(b); });
    const f = document.createElement('figure');
    f.append(c, a);
    document.getElementById('out').append(f);
  }
};
img.src = '../icon.svg';
</script>
</body>
</html>
