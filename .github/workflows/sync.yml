name: Синхронізація і публікація

on:
  schedule:
    - cron: "17 */6 * * *"   # кожні 6 годин (час UTC)
    - cron: "*/10 * * * *"   # нові організації, додані в додатку
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      add:
        description: "Додати організацію: код ЄДРПОУ"
        required: false
        default: ""
      note:
        description: "Примітка до організації (необовʼязково)"
        required: false
        default: ""
      remove:
        description: "Прибрати організацію: код ЄДРПОУ"
        required: false
        default: ""

permissions:
  contents: write   # зберігати оновлені дані в репозиторій
  pages: write      # публікувати сайт
  id-token: write

# Запуски йдуть по одному: два одночасні переписали б дані один одного.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  # The 10-minute schedule only looks for organisations added in the app; the
  # full refresh below runs only when there are some, and on every other trigger.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Перевірити нові організації
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "*/10 * * * *" ]; then
            python3 sync/sync.py --check
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always start from the newest main: a queued run must see the data the
      # previous run committed, not the snapshot of the commit that triggered it.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Оновити дані з spending.gov.ua
        env:
          ADD: ${{ inputs.add }}
          NOTE: ${{ inputs.note }}
          REMOVE: ${{ inputs.remove }}
        run: python3 sync/sync.py --add "$ADD" --note "$NOTE" --remove "$REMOVE"

      - name: Зберегти дані в репозиторій
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення даних"
            # On a clash in data/ keep what this run has just built.
            git pull --rebase -X theirs
            git push
          fi

      # Version and build id go into the published copy only (not committed).
      - name: Проставити версію збірки
        run: python3 tools/stamp.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
